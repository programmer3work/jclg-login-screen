<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JCLG | Initial Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260829-1">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main class="split-shell">
    <section class="campus-panel" aria-label="JCLG campus preview">
        <div class="campus-art">
            <img id="campus-image" src="" alt="JCLG campus reference image">
        </div>
    </section>

    <aside class="login-panel">
        <div class="login-card">
            <h1 class="login-title">JCLG Initial Login</h1>
            <p class="subtitle">One initial login only</p>
            <div id="app"></div>
            <p id="error" role="alert"></p>
        </div>
    </aside>
</main>
<script src="config.js"></script>
<script>
    const campusImage = document.getElementById('campus-image');
    if (campusImage) {
        campusImage.src = window.JCLG_CONFIG?.campusImage || 'assets/jclg-campus-reference.jpg';
    }
</script>
<script src="app.js"></script>
</body>
</html>
